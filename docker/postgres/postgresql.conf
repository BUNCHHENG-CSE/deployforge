# ====================================================================
# DeployForge Production & WSL Docker PostgreSQL 16 Optimization Config
# Tuned for high-concurrency micro-SaaS, JSONB operations, and NVMe/SSD storage
# ====================================================================

# --- Connectivity & Network ---
listen_addresses = '*'
max_connections = 100
superuser_reserved_connections = 3

# --- Memory Allocation ---
# Recommended: ~25% of dedicated RAM for shared_buffers
shared_buffers = 256MB
# Temporary memory for sorts, hashes, and JSONB aggregations per query operation
work_mem = 16MB
# Memory used by maintenance operations like VACUUM, CREATE INDEX
maintenance_work_mem = 64MB
# Planner assumption of total cache available (OS cache + shared_buffers)
effective_cache_size = 768MB

# --- Write-Ahead Logging (WAL) & Checkpoints ---
wal_level = replica
wal_buffers = 16MB
# Spreads checkpoints over 90% of the checkpoint interval to eliminate I/O spikes
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min
min_wal_size = 512MB
max_wal_size = 2GB

# --- Query Planner Tuning (NVMe / SSD Optimized) ---
# NVMe SSD storage makes random disk reads nearly as cheap as sequential reads
random_page_cost = 1.1
seq_page_cost = 1.0
# Number of concurrent disk I/O operations that can be serviced simultaneously
effective_io_concurrency = 200
# Statistics target for planner selectivity estimation
default_statistics_target = 100

# --- Parallel Query Execution ---
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# --- Autovacuum Tuning (Keeps JSONB tables compact and bloat-free) ---
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
autovacuum_vacuum_cost_limit = 500

# --- Query Performance Logging & Slow Query Diagnostics ---
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
# Log any query taking longer than 500ms for performance monitoring
log_min_duration_statement = 500
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
timezone = 'UTC'
client_encoding = 'UTF8'
