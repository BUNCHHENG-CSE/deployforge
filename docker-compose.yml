services:
  # Optional local PostgreSQL container if not using remote Neon PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: tct-deployforge-postgres
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deployforge}
      POSTGRES_USER: ${POSTGRES_USER:-deployforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deployforge_secret}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - deployforge_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deployforge} -d ${POSTGRES_DB:-deployforge}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - deployforge_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tct-deployforge-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_TYPE: ${DB_TYPE:-postgresql}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-deployforge}:${POSTGRES_PASSWORD:-deployforge_secret}@postgres:5432/${POSTGRES_DB:-deployforge}}
    ports:
      - "3000:3000"
    volumes:
      - deployforge_workspace:/app/workspace
    networks:
      - deployforge_network
    depends_on:
      postgres:
        condition: service_healthy
        required: false

volumes:
  deployforge_pgdata:
    name: deployforge_pgdata
  deployforge_workspace:
    name: deployforge_workspace

networks:
  deployforge_network:
    name: deployforge_network
    driver: bridge
